<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Cafe Antigravity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; background: var(--bg-dark); }
        .login-card { background: var(--bg-card); border:1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); }
        .login-logo { text-align:center; margin-bottom:28px; }
        .login-logo .icon { width:64px; height:64px; background: linear-gradient(135deg,#c8a97e,#8f6e45); border-radius:16px; display:inline-flex; align-items:center; justify-content:center; font-size:28px; color:#111; margin-bottom:12px; }
        .login-logo h2 { font-size:22px; font-weight:700; color:var(--text-primary); }
        .login-logo p { font-size:13px; color:var(--text-muted); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <div class="icon"><i class="fas fa-mug-hot"></i></div>
            <h2>CAFE ANTIGRAVITY</h2>
            <p>Hệ thống quản lý quán cà phê</p>
        </div>

        <!-- Login Form -->
        <div id="form-login">
            <div style="background: rgba(200, 169, 126, 0.1); border: 1px dashed var(--primary-gold); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 13px;">
                <div style="font-weight: 600; color: var(--primary-gold); margin-bottom: 4px;">
                    <i class="fas fa-key"></i> Tài khoản có sẵn:
                </div>
                <div style="color: var(--text-secondary); line-height: 1.6;">
                    • <strong>Chủ quán (Owner):</strong> <code>admin</code> / <code>admin123</code><br>
                    • <strong>Pha chế (Barista):</strong> <code>barista1</code> / <code>admin123</code>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fas fa-user"></i> Tên đăng nhập</label>
                <input type="text" id="login-username" class="form-control" placeholder="Nhập tên đăng nhập..." autofocus value="admin">
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock"></i> Mật khẩu</label>
                <input type="password" id="login-password" class="form-control" placeholder="Nhập mật khẩu..." value="admin123">
            </div>
            <div id="login-error" style="color:var(--danger);font-size:13px;margin-bottom:12px;display:none;"></div>
            <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">
                <i class="fas fa-sign-in-alt"></i> Đăng nhập
            </button>

            <div style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-subtle); font-size: 12px; color: var(--text-muted); line-height: 1.6;">
                <i class="fas fa-shield-halved" style="color: var(--primary-gold);"></i> <strong>Hệ thống quản lý nội bộ</strong><br>
                Tài khoản được cấp và quản lý tập trung bởi <strong>Chủ quán / Quản lý</strong> trong mục Nhân sự.
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/main.js"></script>
    <script>
    async function doLogin() {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        const errEl = document.getElementById('login-error');
        if (!username || !password) { errEl.textContent='Vui lòng nhập đầy đủ!'; errEl.style.display=''; return; }
        const res = await apiCall('/api/auth/login', 'POST', {username, password});
        if (res.success) { window.location.href = '/'; }
        else { errEl.textContent = res.message || 'Đăng nhập không thành công!'; errEl.style.display = ''; }
    }
    document.addEventListener('keydown', e => { 
        if (e.key === 'Enter') { 
            doLogin(); 
        }
    });
    </script>
</body>
</html>
